<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - 100 Posts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        header { background: #333; color: #fff; padding: 20px; text-align: center; }
        h1 { margin: 0; }
        nav { background: #444; padding: 10px; }
        nav a { color: #fff; margin: 0 10px; text-decoration: none; }
        .container { max-width: 800px; margin: 0 auto; }
        .post { background: #fff; margin: 20px 0; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post h2 { color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .post-meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .post-content { line-height: 1.6; }
        footer { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>My Blog</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Archive</a>
